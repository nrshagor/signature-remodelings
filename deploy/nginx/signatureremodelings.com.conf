# signatureremodelings.com — Signature Remodelings PREVIEW (client preview, before launch)
#
# Next.js standalone server on 127.0.0.1:3204, run by the "builders" user's PM2 as
# "signature-production" (deploy/deploy.sh signature production). The production
# process is built with SITE_INDEXABLE=false for now, so every page is noindex and
# robots.txt disallows all; this file adds X-Robots-Tag noindex on every response too.
# No password: the client opens the real domain.
#
# Written for a SHARED Nginx: no default_server, nothing global; every setting is scoped
# to this file and the upstream name is unique. Never edit sites-available/default.
# No security headers here: the app sends them (next.config.ts). Don't add them.
# www.signatureremodelings.com redirects to the bare domain.
#
# This is the HTTP-only version for the first setup: there are no ssl_* or listen 443
# lines yet. certbot adds them (deploy/README.md, "First-time server setup"):
#   sudo cp signatureremodelings.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/signatureremodelings.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d signatureremodelings.com -d www.signatureremodelings.com
# certbot then edits /etc/nginx/sites-available/signatureremodelings.com.conf only: it adds
# `listen 443 ssl`, the certificate lines and the HTTP→HTTPS redirects to both server
# blocks. After that, edit the installed file, not this copy (copying this file over it
# again would drop certbot's lines).
#
# --- AT LAUNCH ---------------------------------------------------------------------------
#   1. Rebuild production with SITE_INDEXABLE=true in signature-production/shared/.env
#      (deploy.sh signature production).
#   2. In the installed file, delete every `add_header X-Robots-Tag …` line (both server
#      blocks, all locations, including the HTTPS ones certbot wrote).
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. curl -sI https://signatureremodelings.com/ | grep -i x-robots   → nothing
# -----------------------------------------------------------------------------------------

upstream builders_signature_production {
    server 127.0.0.1:3204;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.signatureremodelings.com;

    # Let's Encrypt HTTP-01 challenges.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;   # PREVIEW: remove at launch
        return 301 https://signatureremodelings.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name signatureremodelings.com;

    # Let's Encrypt HTTP-01 challenges.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # The contact form is the only thing that posts, and it is small.
    client_max_body_size 1m;

    # --- Compression (this site only) -------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/rss+xml image/svg+xml font/ttf font/otf;

    # --- Proxy headers (the contact form rate limit needs the real client IP) ---------
    # X-Real-IP is overwritten with the address Nginx sees, so a visitor can't fake it.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Note: an add_header inside a location replaces all server-level add_header lines,
    # so X-Robots-Tag is repeated in each location below.

    # Hashed build assets: served from disk, cached for a year.
    location /_next/static/ {
        # Literal path on purpose: alias with a variable stops appending the URI.
        # `current` is the live release symlink, switched by deploy.sh.
        alias /var/www/builders/signature-production/current/.next/static/;
        # No `always`: cache headers only on successful responses.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag  "noindex, nofollow" always;   # PREVIEW: remove at launch
        access_log off;
    }

    # public/images: brand files and project photos. Names aren't hashed: 30 days.
    location /images/ {
        alias /var/www/builders/signature-production/current/public/images/;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Robots-Tag  "noindex, nofollow" always;   # PREVIEW: remove at launch
        access_log off;
    }

    # Everything else (pages, /_next/image, robots.txt, the contact form): Next.js.
    location / {
        proxy_pass http://builders_signature_production;
        proxy_read_timeout 60s;
        add_header X-Robots-Tag "noindex, nofollow" always;    # PREVIEW: remove at launch
    }
}
